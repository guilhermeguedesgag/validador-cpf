<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro concluído</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f4f5f7; display:flex; justify-content:center; padding:40px 16px; }
    .card { background:#fff; padding:28px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); max-width:420px; width:100%; text-align:center; }
    a { color:#1f6feb; }
  </style>
</head>
<body>
<div class="card">
  <h1>Cadastro realizado com sucesso! ✅</h1>
  <p th:if="${nome}">Bem-vindo(a), <strong th:text="${nome}"></strong>! Seus dados foram validados e registrados com sucesso.</p>
  <p><a th:href="@{/}">Novo cadastro</a></p>
</div>
</body>
</html>
