<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f4f5f7; display:flex; justify-content:center; padding:40px 16px; }
    .card { background:#fff; padding:28px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); width:100%; max-width:420px; }
    h1 { margin-top:0; font-size:1.4rem; }
    label { display:block; margin:14px 0 4px; font-weight:600; font-size:.9rem; }
    input { width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-size:1rem; }
    button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:8px; background:#1f6feb; color:#fff; font-size:1rem; cursor:pointer; }
    .erro { color:#b42318; font-size:.85rem; margin-top:4px; }
    .alerta { background:#fee4e2; color:#b42318; padding:10px 12px; border-radius:8px; margin-bottom:8px; }
  </style>
</head>
<body>
<div class="card">
  <h1>Cadastro de pessoa física</h1>



  <form th:action="@{/cadastro}" th:object="${form}" method="post">
    <div class="alerta" th:if="${#fields.hasGlobalErrors()}">
      <strong>⚠️ Atenção:</strong>
      <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
    </div>

    <label for="nome">Nome completo</label>
    <input id="nome" type="text" th:field="*{nome}">
    <div class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>

    <label for="cpf">CPF</label>
    <input id="cpf" type="text" th:field="*{cpf}" placeholder="000.000.000-00" maxlength="14">
    <div class="erro" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>

    <label for="dataNascimento">Data de nascimento</label>
    <input id="dataNascimento" type="date" th:field="*{dataNascimento}">
    <div class="erro" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></div>

    <button type="submit">Cadastrar</button>
  </form>
</div>
<script>
  document.getElementById('cpf').addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '').slice(0, 11);
    v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    e.target.value = v;
  });
</script>
</body>
</html>
