spring.application.name=cadastro-cpf
spring.datasource.url=jdbc:h2:file:./data/cadastro
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# mock | serpro
cpf.provider=mock

# Só usado com cpf.provider=serpro (use variáveis de ambiente, nunca commite credenciais)
serpro.base-url=https://gateway.apiserpro.serpro.gov.br/consulta-cpf-df/v3
serpro.token-url=https://gateway.apiserpro.serpro.gov.br/token
serpro.consumer-key=${SERPRO_KEY:}
serpro.consumer-secret=${SERPRO_SECRET:}
