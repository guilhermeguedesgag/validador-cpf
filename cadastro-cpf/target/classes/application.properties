spring.application.name=cadastro-cpf

# Banco em memória — dados somem ao reiniciar a aplicação (ideal para demo)
spring.datasource.url=jdbc:h2:mem:cadastro;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Sessão expira em 30 minutos — ao expirar, dados do usuário são apagados automaticamente
server.servlet.session.timeout=30m

# mock | serpro
cpf.provider=serpro

# --- Ambiente Trial (homologação) ---
serpro.base-url=https://gateway.apiserpro.serpro.gov.br/consulta-cpf-df-trial/v3
serpro.token-url=https://gateway.apiserpro.serpro.gov.br/token
# Token fixo do trial (não precisa de OAuth2)
serpro.static-token=06aef429-a981-3ec5-a1f8-71d38d86481e
# Credenciais OAuth2 (deixar vazio no trial; preencher em produção via variável de ambiente)
serpro.consumer-key=${SERPRO_KEY:}
serpro.consumer-secret=${SERPRO_SECRET:}
